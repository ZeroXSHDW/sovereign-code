[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-code"
version = "0.2.0"
description = "Terminal-first, local-first AI coding console for Apple Silicon"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sovereign Code" }]
keywords = ["ai", "local", "ollama", "llm", "coding", "terminal", "textual", "offline", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Terminals",
]
dependencies = [
    "textual>=1.0,<9",
    "httpx>=0.27,<1",
    "rich>=13,<15",
]

[project.urls]
Homepage = "https://github.com/ZeroXSHDW/sovereign-code"
Issues = "https://github.com/ZeroXSHDW/sovereign-code/issues"
Source = "https://github.com/ZeroXSHDW/sovereign-code"

[project.optional-dependencies]
browser = ["playwright>=1.50"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
sovereign = "sovereign_code.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF", "SIM"]
ignore = [
    "BLE001",  # broad except is used deliberately to surface errors to the user
    "S101",    # assert is expected in tests
    "S110",    # try/except pass is used in cleanup paths
    "RUF012",  # typing-only defaults; no runtime mutation
    "SIM102",  # collapsible-if kept for readability
    "SIM105",  # contextlib.suppress kept for readability
    "SIM117",  # nested with kept for readability
    "UP042",   # str-Enum pattern is intentional and works across versions
]

[tool.ruff.lint.per-file-ignores]
"src/sovereign_code/browser/executor.py" = ["E501"]  # embedded JS
"src/sovereign_code/cli.py" = ["E501"]               # plist template lines
"src/sovereign_code/webchat.py" = ["E501"]           # inline HTML/CSS/JS
