name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The default token is enough for checkout and artifact upload. Nothing here
# needs write access to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4
        with:
          args: check --output-format=github
      - uses: astral-sh/ruff-action@v4
        with:
          args: format --check --diff

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras --dev
      - name: Mypy
        run: uv run mypy

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked --all-extras --dev
      - name: Test
        run: uv run pytest -q

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras --dev
      - name: Coverage
        run: uv run pytest -q --cov=sovereign_code --cov-report=xml --cov-report=term
      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.xml
          if-no-files-found: error

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras --dev
      - name: pip-audit
        run: uv run pip-audit --strict || uv run pip-audit

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build
        run: uv build
      - name: Check the wheel installs and the console script runs
        run: |
          uv run --isolated --with dist/*.whl sovereign --help
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
