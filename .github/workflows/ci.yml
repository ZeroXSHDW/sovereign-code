name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: catch dependency drift and flaky tests without a push.
    - cron: "0 6 * * 1"

# The default token is enough for checkout and artifact upload. Nothing here
# needs write access to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras --dev
      - name: Ruff check
        run: uv run ruff check --output-format=github
      - name: Ruff format
        run: uv run ruff format --check --diff

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras --dev
      - name: Mypy
        run: uv run mypy

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked --all-extras --dev
      - name: Install browser
        run: uv run playwright install chromium
      - name: Test
        run: uv run pytest -q

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras --dev
      - name: Install browser
        run: uv run playwright install chromium
      - name: Coverage
        run: uv run pytest -q --cov=sovereign_code --cov-report=xml --cov-report=term
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.xml
          if-no-files-found: error

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras --dev
      - name: Export third-party requirements
        run: uv export --no-emit-project --no-hashes -o /tmp/sovereign-audit-requirements.txt
      - name: pip-audit
        run: uv run pip-audit --strict -r /tmp/sovereign-audit-requirements.txt

  minimum:
    name: minimum dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Resolve the oldest allowed direct dependencies
        run: uv pip compile pyproject.toml --extra dev --extra browser --resolution lowest-direct -o /tmp/requirements-min.txt
      - name: Install
        run: |
          uv venv --python 3.11
          uv pip install -r /tmp/requirements-min.txt
          uv pip install -e . --no-deps
      - name: Test
        run: .venv/bin/python -m pytest -q

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build
        run: uv build
      - name: Check the wheel installs and the console script runs
        run: |
          uv run --isolated --with dist/*.whl sovereign --help
      - name: Check the wheel ships the TUI stylesheet
        run: |
          unzip -l dist/*.whl | grep -q 'sovereign_code/tui/app.tcss'
          unzip -l dist/*.whl | grep -q 'sovereign_code/py.typed'
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
